name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - iteration/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: dsh-rust-sdk
          workspaces: .

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Keyless live-runtime guard (launch spec §9 item 4): installs ONE exact
  # @deepseek-ai/dsh version, caches npm, and boots the real CLI through the
  # keyless handshake tier (tests/real_runtime.rs::real_runtime_handshake).
  # No secret, no LLM call. Independent by design: nothing depends on this job
  # and it is not a required check for docs-only PRs (making it a required
  # gate is a PM decision, not a workflow change).
  #
  # Pin rationale: the SDK launch/wire contract is frozen to deepseek-harness @
  # c389f96bf3a9b6807cb71ed6bdad5849be0df6d8
  # (`dsh-v0.1.3-alpha.2-133-gc389f96bf3`, 2026-09-08) — 0.1.3-alpha.2 is the
  # closest published tag on that upstream line (existence verified via
  # `npm view @deepseek-ai/dsh versions --json`). The newer 0.1.5-alpha.1
  # (2026-09-08) has no verified contract alignment, so it is deliberately
  # not used. Exact pin, never a dist-tag: the handshake result is
  # reproducible run to run.
  keyless-runtime-handshake:
    name: keyless runtime handshake (pinned dsh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Cache npm
        # actions/cache@v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm
          # keyed on the exact pin: the tarball for that version is immutable,
          # so a hit is the full npm cache the pinned global install needs
          key: ${{ runner.os }}-npm-dsh-cli-0.1.3-alpha.2

      - name: Install pinned dsh runtime
        # exact pin (never a dist-tag); rationale in the job comment above
        run: npm install -g @deepseek-ai/dsh@0.1.3-alpha.2

      - name: Resolve runtime binary
        # Fail loudly when the pinned runtime cannot be resolved: an empty
        # DSH_RUNTIME_BIN would make test tiers skip and the job would go
        # green without ever running the handshake (qc3 F-001).
        run: |
          DSH_RUNTIME_BIN="$(command -v dsh)"
          if [ -z "$DSH_RUNTIME_BIN" ]; then
            echo "::error::dsh not found on PATH after npm install -g @deepseek-ai/dsh@0.1.3-alpha.2"
            exit 1
          fi
          echo "DSH_RUNTIME_BIN=$DSH_RUNTIME_BIN" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: dsh-rust-sdk
          workspaces: .

      - name: Run keyless runtime handshake
        run: cargo test --test real_runtime real_runtime_handshake

  changes:
    name: changelog fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      # A PR must contribute its own fragment changes. Exempt Release-prep
      # output entirely — recognized by EITHER a release/* head branch OR a
      # diff confined to the four paths Release prep writes (.changes/,
      # CHANGELOG.md, Cargo.toml, Cargo.lock): that workflow archives
      # fragments by design, so it can never add an unreleased one.
      - name: Require a .changes/unreleased fragment in the PR diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == release/* ]]; then
            echo "Release-prep branch detected; exempt from the fragment gate."
            exit 0
          fi
          BASE="origin/${BASE_REF}"
          CHANGED="$(git diff --name-only "${BASE}...HEAD" || true)"
          NON_PREP="$(printf '%s\n' "$CHANGED" | grep -v -E -e '^\.changes/' -e '^CHANGELOG\.md$' -e '^Cargo\.toml$' -e '^Cargo\.lock$' || true)"
          if [ -z "$NON_PREP" ]; then
            echo "Diff is confined to Release-prep artifact paths; exempt from the fragment gate."
            exit 0
          fi
          FRAGMENTS="$(git diff --name-only "${BASE}...HEAD" -- '.changes/unreleased/' | grep -v -E -e '/\.gitkeep$' -e '^\.changes/unreleased/README\.md$' || true)"
          if [ -z "$FRAGMENTS" ]; then
            echo "::error::This PR does not add or modify any .changes/unreleased/ fragment. Every user-visible change ships a fragment in the same PR (format: docs/release.md). Release-prep output is exempt."
            exit 1
          fi
          echo "Fragments in this PR:"
          printf '%s\n' "$FRAGMENTS"
